# Publishes the GDD (proyectoJuegoUNAD/Assets/Docs/GuardianesdelBosqueGDD.md) as a web page on GitHub Pages, so the
# whole team (and the UNAD tutor) can read the latest version without opening the repository. It rebuilds whenever the
# GDD, the page style or this workflow changes on main, and can be run by hand from the Actions tab. Runs on other
# branches only build the page (to check it), they never publish it.
name: GDD web page

on:
  push:
    branches: [main]
    paths:
      - 'proyectoJuegoUNAD/Assets/Docs/GuardianesdelBosqueGDD.md'
      - '.github/gdd-site/**'
      - '.github/workflows/gdd-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gdd-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Unity project is large; only the GDD and the page files are needed.
          sparse-checkout: |
            proyectoJuegoUNAD/Assets/Docs
            .github
          sparse-checkout-cone-mode: false

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Build the page
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          mkdir -p _site
          cp .github/gdd-site/style.css _site/
          updated="$(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora de Colombia)"
          gdd="proyectoJuegoUNAD/Assets/Docs/GuardianesdelBosqueGDD.md"
          cat > header.html <<EOF
          <div class="banner">
            <strong>Guardianes del Bosque · Documento de diseño (GDD)</strong><br>
            Última actualización: ${updated} · rama <code>${REF}</code> · versión
            <a href="${REPO_URL}/commit/${SHA}"><code>${SHA:0:7}</code></a> ·
            <a href="${REPO_URL}/commits/main/${gdd}">historial de cambios</a> ·
            <a href="${REPO_URL}/blob/main/${gdd}">ver en GitHub</a>
          </div>
          EOF
          pandoc "$gdd" \
            --from gfm \
            --to html5 \
            --standalone \
            --toc --toc-depth=2 \
            --metadata title="Guardianes del Bosque — GDD" \
            --metadata lang=es \
            --css style.css \
            --include-before-body header.html \
            --output _site/index.html
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
